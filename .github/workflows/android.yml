name: Android Debug Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      - name: Setup Android SDK (versão fixa)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          cmdline-tools-version: '9.0'
      
      - name: Download Godot + Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          unzip -q export_templates.tpz -d $HOME/.local/share/godot/export_templates/4.3.stable
          rm export_templates.tpz
      
      - name: Install plugins
        run: |
          cd addons
          git clone --depth 1 -b 4.x https://github.com/godotengine/godot-payment-plugin.git godotpayment
          git clone --depth 1 -b 4.x https://github.com/godotengine/godot-admob-plugin.git godotadmob
          git clone --depth 1 -b 4.x https://github.com/godotengine/godot-play-games-services.git godotplaygamesservices
          git clone --depth 1 -b 4.x https://github.com/godotengine/godot-notifications.git godotnotifications
      
      - name: Fix scripts (// operator)
        run: |
          sed -i 's|daily_streak // 7|int(daily_streak / 7)|g' scripts/autoload/GameManager.gd
          sed -i 's|elapsed // LIVES_RECOVERY_TIME|int(elapsed / LIVES_RECOVERY_TIME)|g' scripts/autoload/GameManager.gd
      
      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/9.0/bin:$ANDROID_HOME/platform-tools
          ./Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Android" build.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockMaster-debug
          path: build.apk
