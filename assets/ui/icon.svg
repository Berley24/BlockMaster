<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>
  
  <g transform="translate(256, 256)" filter="url(#glow)">
    <rect x="-120" y="-120" width="80" height="80" rx="8" fill="url(#blockGrad1)" transform="rotate(-15)"/>
    <rect x="40" y="-120" width="80" height="80" rx="8" fill="url(#blockGrad2)" transform="rotate(10)"/>
    <rect x="-120" y="40" width="80" height="80" rx="8" fill="url(#blockGrad3)" transform="rotate(5)"/>
    <rect x="40" y="40" width="80" height="80" rx="8" fill="url(#blockGrad1)" transform="rotate(-5)"/>
    
    <rect x="-80" y="-80" width="60" height="60" rx="6" fill="url(#blockGrad2)" opacity="0.9"/>
    <rect x="-20" y="-80" width="60" height="60" rx="6" fill="url(#blockGrad3)" opacity="0.9"/>
    <rect x="20" y="-80" width="60" height="60" rx="6" fill="url(#blockGrad1)" opacity="0.9"/>
    <rect x="-80" y="-20" width="60" height="60" rx="6" fill="url(#blockGrad3)" opacity="0.9"/>
    <rect x="-20" y="-20" width="60" height="60" rx="6" fill="url(#blockGrad1)" opacity="0.9"/>
    <rect x="20" y="-20" width="60" height="60" rx="6" fill="url(#blockGrad2)" opacity="0.9"/>
  </g>
  
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff" filter="url(#glow)">BLOCK MASTER</text>
</svg>